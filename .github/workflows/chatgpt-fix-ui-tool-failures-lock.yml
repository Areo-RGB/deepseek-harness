name: ChatGPT fix UI tool failures lock importer

on:
  push:
    branches:
      - feat/ui-tool-failure-counter
    paths:
      - .github/workflows/chatgpt-fix-ui-tool-failures-lock.yml

permissions:
  contents: write

jobs:
  fix-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Web app workspace dependency to lock importer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pnpm-lock.yaml')
          text = path.read_text()
          start = text.index('\n  packages/bundle/web-app:\n')
          end = text.index('\n  packages/', start + 1)
          section = text[start:end]
          needle = """      '@deepseek-ai/dsh-client-ui-tool':
                specifier: workspace:^
                version: link:../../client/ui-tool
          """
          addition = """      '@deepseek-ai/dsh-client-ui-tool-failures':
                specifier: workspace:^
                version: link:../../client/ui-tool-failures
          """
          if section.count(needle) != 1:
              raise SystemExit(f'expected one web-app ui-tool entry, got {section.count(needle)}')
          if '@deepseek-ai/dsh-client-ui-tool-failures' in section:
              raise SystemExit('web-app lock importer already contains ui-tool-failures')
          section = section.replace(needle, needle + addition)
          path.write_text(text[:start] + section + text[end:])
          PY
          grep -A3 -B3 "dsh-client-ui-tool-failures" pnpm-lock.yaml

      - name: Commit clean lock fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-fix-ui-tool-failures-lock.yml
          git add pnpm-lock.yaml .github/workflows/chatgpt-fix-ui-tool-failures-lock.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(lockfile): link UI tool failures in web app"
          git push origin HEAD:feat/ui-tool-failure-counter
